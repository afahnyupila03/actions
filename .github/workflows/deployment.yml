name: Deploy Project
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3 ## To run an action, use the uses-keyword instead of the run-keyword.
        # with:  ## Configuration to action
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with: 
          node-version: 24
      - name: Install dependencies
        run: npm ci ## Install all exact versions of package dependencies locked into package-lock.json file.
      - name: Run tests
        run: npm test
  deploy: 
    needs: test ## Runs only after job specified in field is done before this job executes. 
    # In case of multiple jobs use [] and separate with commas.
    runs-on: windows-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3 ## To run an action, use the uses-keyword instead of the run-keyword.
        # with:  ## Configuration to action
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with: 
          node-version: 24
      - name: Install dependencies
        run: npm ci ## Install all exact versions of package dependencies locked into package-lock.json file.
      - name: Build project
        run: npm run build
      - name: Deploy
        run: echo "Deploying!..."